<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Pen Sync</title>
    <link rel="stylesheet" href="index.css" />
    <style>
        label {
            display: inline-block;
            min-width: 8em;
        }
    </style>
</head>

<body>
    <h1>Web Pen Sync</h1>
    <form method="delete">
        <p><label for="deviceInp">device:</label> <input id="deviceInp" /></p>
        <p><label for="nameInp">name:</label> <input id="nameInp" /></p>
        <p><label for="passwordInp">password:</label> <input id="passwordInp" /></p>
        <p><button id="syncBtn">Sync!</button> <em id="onlineCount">
                <script>document.write((new Date()).toLocaleTimeString())</script>: Waiting for other devices..
            </em></p>
    </form>
    <script>
        document.querySelector("#syncBtn").addEventListener("click", e => {
            e.preventDefault()
            let device = document.querySelector("#deviceInp").value.trim()
            let name = document.querySelector("#nameInp").value.trim()
            let password = document.querySelector("#passwordInp").value.trim()

            if (device) {
                localStorage.setItem("_browser_id", device)
                fetch("./online.json", { method: "put", body: JSON.stringify([device]) })
            }

            if (name && password) {
                fetch("./sync.json", {
                    method: "put", body: JSON.stringify({
                        name: name,
                        password: password
                    })
                })
            } else {
                fetch("./sync.html", { method: "delete" })
                location.reload(true)
            }
        })

        let timeout = 16
        async function announceId() {
            let j = []
            try {
                j = await fetch("./online.json")
                j = await j.json() || []
            } catch (error) {
                j = []
            }
            if (!j.includes(id)) {
                j.push(id)
                fetch("./online.json", { method: "put", body: JSON.stringify(j) })
            }
            document.querySelector("#onlineCount").textContent = now.toLocaleTimeString() + ": Synced with " + j.join(", ")

            if (timeout < 9000) timeout *= 2
            setTimeout(announceId, timeout + Math.random() * timeout * 2)
        }

        let id = localStorage.getItem("_browser_id") || "" + Math.random()
        document.querySelector("#deviceInp").value = id
        fetch("./online.json", { method: "put", body: JSON.stringify([id]) })

        let now = new Date()
        let min = now.getMinutes()
        let hrs = now.getHours()
        setInterval(e => {
            now = new Date()
            if (hrs != now.getHours()) {
                fetch("./online.json", { method: "delete" })
                history.back()
            } else if (min != now.getMinutes()) {
                fetch("./sw.js", { method: "delete" })
            }
            min = now.getMinutes()
            hrs = now.getHours()
        }, 1024)

        navigator.serviceWorker.register("./sw.js", { scope: "./" })
        announceId()
    </script>
</body>

</html>
