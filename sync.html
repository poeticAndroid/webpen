<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Pen Sync</title>
    <style>
        html {
            font-family: monospace;
            background: #012;
            color: #def;
        }

        a {
            color: aqua;
        }

        label {
            display: inline-block;
            min-width: 8em;
        }

        #run {
            position: absolute;
            margin: 0;
            left: 0;
            right: 0;
            top: 0;
            text-align: center;
        }

        #run a {
            background-color: #234;
            padding: 0.75em 1.5em;
            border-radius: 0 0 2em 2em;
        }
    </style>
</head>

<body>
    <p id="run">
        <a id="urlLink" accesskey="r" href="./">/ Root</a>
    </p>
    <h1>Sync!</h1>
    <form method="delete">
        <p><label for="deviceInp">device:</label> <input id="deviceInp" /></p>
        <p><label for="nameInp">name:</label> <input id="nameInp" /></p>
        <p><label for="passwordInp">password:</label> <input id="passwordInp" /></p>
        <p><button id="syncBtn">Sync!</button> <em id="onlineCount">
                <script>document.write((new Date()).toLocaleTimeString())</script>: Waiting for other devices..
            </em></p>
    </form>
    <script>
        document.querySelector("#syncBtn").addEventListener("click", e => {
            e.preventDefault()
            let device = document.querySelector("#deviceInp").value.trim() || "" + Date.now() + Math.random()
            let name = document.querySelector("#nameInp").value.trim()
            let password = document.querySelector("#passwordInp").value.trim()

            localStorage.setItem("_browser_id", device)

            if (name && password) {
                fetch("./sync.json", {
                    method: "put", body: JSON.stringify({
                        name: name,
                        password: password
                    })
                })
            } else {
                fetch("./online.json", { method: "delete" })
                fetch("./sync.html", { method: "delete" })
                location.reload(true)
            }
        })

        let lastCount = -1
        async function announceId() {
            let id = localStorage.getItem("_browser_id")
            let j = []
            if (id) {
                try {
                    j = await fetch("./online.json")
                    j = await j.json() || []
                } catch (error) {
                    j = []
                }
                if (!j.includes(id)) {
                    j.push(id)
                    fetch("./online.json", { method: "put", body: JSON.stringify(j) })
                }
                document.querySelector("#onlineCount").textContent = now.toLocaleTimeString() + ": " + j.join(", ") + " are online.."
            } else {
                id = "" + Date.now() + Math.random()
                localStorage.setItem("_browser_id", id)
                document.querySelector("#deviceInp").value = id
                fetch("./online.json", { method: "put", body: JSON.stringify([id]) })
            }
            if (lastCount !== j.length) setTimeout(announceId, 4096 + Math.random() * 4096)
            lastCount = j.length
        }

        let now = new Date()
        let min = now.getMinutes()
        let hrs = now.getHours()
        fetch("./sw.js", { method: "delete" })
        setInterval(e => {
            now = new Date()
            if (hrs != now.getHours()) {
                fetch("./online.json", { method: "delete" })
                history.back()
                min = now.getMinutes()
                hrs = now.getHours()
            } else if (min != now.getMinutes()) {
                location.reload(true)
            }
        }, 1024)

        navigator.serviceWorker.register("./sw.js", { scope: "./" })
        announceId()
    </script>
</body>

</html>
