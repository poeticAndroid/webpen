<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Pen</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <p><a href="./">🗃️ Files</a></p>
  <script>
    setTimeout(() => {
      if (!location.pathname.endsWith("/index.html")) location.replace("./index.html")
    }, 1024)
    navigator.serviceWorker.register("./sw.js", { scope: "./" })
  </script>
</body>

</html>
